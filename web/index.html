<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK 安装管家</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="dropveil"><div class="veil-inner"><div class="veil-icon">⬇</div><div data-i18n="veilMain"></div><div class="veil-sub" data-i18n="veilSub"></div></div></div>

<header class="topbar">
  <div class="brand"><span class="logo">A</span><div><div class="t1" data-i18n="appName"></div><div class="t2" data-i18n="appTag"></div></div></div>
  <div class="device-box">
    <select id="deviceSel"></select>
    <button id="btnRefresh" class="ghost" data-i18n="refresh"></button>
    <span id="adbState" class="adb-state"></span>
    <select id="langSel" class="lang-sel" title="Language">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
    <button id="btnQuit" class="ghost small" data-i18n="quit"></button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="queue"><span data-i18n="tabQueue"></span> <span id="queueCount" class="pill">0</span></button>
  <button class="tab" data-tab="apps" data-i18n="tabApps"></button>
  <button class="tab" data-tab="wireless" data-i18n="tabWireless"></button>
  <button class="tab" data-tab="settings" data-i18n="tabSettings"></button>
</nav>

<!-- ============ 安装队列 ============ -->
<section class="page active" id="page-queue">
  <div class="dropzone" id="dropzone">
    <div class="dz-main" data-i18n="dropMain"></div>
    <div class="dz-sub" data-i18n="dropSub"></div>
    <div class="dz-row">
      <input id="pathInput" type="text" data-i18n-ph="pathPlaceholder">
      <button id="btnImport" class="primary small" data-i18n="import"></button>
    </div>
  </div>

  <div class="toolbar">
    <div class="left">
      <label class="lbl" data-i18n="sort"></label>
      <select id="sortKey">
        <option value="" data-i18n="sortCustom"></option>
        <option value="label" data-i18n="sortLabel"></option>
        <option value="file" data-i18n="sortFile"></option>
        <option value="package" data-i18n="sortPackage"></option>
        <option value="size" data-i18n="sortSize"></option>
        <option value="version" data-i18n="sortVersion"></option>
        <option value="added" data-i18n="sortAdded"></option>
      </select>
      <button id="sortDir" class="ghost small" data-desc="0"></button>
      <span class="sep"></span>
      <select id="profileSel"></select>
      <button id="btnProfLoad" class="ghost small" data-i18n="profileLoad"></button>
      <button id="btnProfSave" class="ghost small" data-i18n="profileSave"></button>
      <button id="btnProfDel" class="ghost small danger" data-i18n="profileDelete"></button>
    </div>
    <div class="right">
      <button id="btnMark" class="ghost small" data-i18n="mark"></button>
      <button id="btnInstallNew" class="ghost small" data-i18n="installNew"></button>
      <button id="btnClear" class="ghost small danger" data-i18n="clear"></button>
      <button id="btnStop" class="ghost small hidden" data-i18n="stop"></button>
      <button id="btnInstall" class="primary" data-i18n="install"></button>
    </div>
  </div>

  <div id="wirelessHint" class="banner hidden"></div>

  <div id="progressWrap" class="progress-wrap hidden">
    <div class="bar"><div id="progressBar" class="fill"></div></div>
    <div id="progressText" class="ptext"></div>
  </div>

  <ul id="list" class="list"></ul>
  <div id="emptyHint" class="empty" data-i18n="emptyQueue"></div>

  <details id="logBox" class="logbox">
    <summary data-i18n="logs"></summary>
    <pre id="log"></pre>
  </details>
</section>

<!-- ============ 设备应用 ============ -->
<section class="page" id="page-apps">
  <div class="toolbar">
    <div class="left">
      <select id="scopeSel">
        <option value="third" data-i18n="scopeThird"></option>
        <option value="system" data-i18n="scopeSystem"></option>
        <option value="all" data-i18n="scopeAll"></option>
      </select>
      <button id="btnScan" class="primary small" data-i18n="scan"></button>
      <button id="btnScanStop" class="ghost small hidden" data-i18n="stop"></button>
      <input id="appSearch" type="search" data-i18n-ph="searchApps">
    </div>
    <div class="right">
      <span id="scanInfo" class="muted"></span>
      <button id="btnSelAll" class="ghost small" data-i18n="selectAll"></button>
      <button id="btnUninstallSel" class="ghost small danger" disabled></button>
      <button id="btnExtractSel" class="primary small" disabled></button>
      <button id="btnOpenOut" class="ghost small" data-i18n="openOut"></button>
    </div>
  </div>
  <div id="scanProgress" class="progress-wrap hidden">
    <div class="bar"><div id="scanBar" class="fill"></div></div>
    <div id="scanText" class="ptext"></div>
  </div>
  <ul id="appList" class="list applist"></ul>
  <div id="appsEmpty" class="empty"><span data-i18n="appsEmpty"></span><br><span class="muted" data-i18n="appsEmptySub"></span></div>
</section>

<!-- ============ 无线连接 ============ -->
<section class="page" id="page-wireless">
  <div class="card">
    <h3 data-i18n="wTitle"></h3>
    <p class="muted" data-i18n="wIntro"></p>
    <div id="wDevices" class="wdev-list"></div>
  </div>

  <div class="card">
    <h3 data-i18n="wStep1"></h3>
    <p class="muted" data-i18n="wStep1Tip"></p>
    <div class="dz-row">
      <input id="pairAddr" type="text" data-i18n-ph="wPairAddr">
      <input id="pairCode" type="text" inputmode="numeric" maxlength="8" style="max-width:150px" data-i18n-ph="wPairCode">
      <button id="btnPair" class="primary small" data-i18n="wPair"></button>
    </div>
  </div>

  <div class="card">
    <h3 data-i18n="wStep2"></h3>
    <p class="muted" data-i18n="wStep2Tip"></p>
    <div class="dz-row">
      <input id="connAddr" type="text" data-i18n-ph="wConnAddr">
      <button id="btnConnect" class="primary small" data-i18n="wConnect"></button>
      <button id="btnDisconnectAll" class="ghost small danger" data-i18n="wDisconnectAll"></button>
    </div>
    <div id="wHistoryBox" class="hist-box"></div>
  </div>

  <div class="card">
    <h3 data-i18n="wStep3"></h3>
    <p class="muted" data-i18n="wStep3Tip"></p>
    <button id="btnSwitchWifi" class="primary small" data-i18n="wSwitch"></button>
  </div>
</section>

<!-- ============ 设置 ============ -->
<section class="page" id="page-settings">
  <div class="card">
    <h3 data-i18n="setInstall"></h3>
    <label class="sw"><input type="checkbox" data-set="reinstall"><span data-i18n="setReinstall"></span></label>
    <label class="sw"><input type="checkbox" data-set="allowDowngrade"><span data-i18n="setDowngrade"></span></label>
    <label class="sw"><input type="checkbox" data-set="grantPermissions"><span data-i18n="setGrant"></span></label>
    <label class="sw"><input type="checkbox" data-set="skipSameVersion"><span data-i18n="setSkipSame"></span></label>
    <label class="sw"><input type="checkbox" data-set="stopOnError"><span data-i18n="setStopErr"></span></label>
    <label class="sw"><input type="checkbox" data-set="autoMark"><span data-i18n="setAutoMark"></span></label>
  </div>
  <div class="card">
    <h3 data-i18n="setUninstall"></h3>
    <label class="sw"><input type="checkbox" data-set="keepDataOnUninstall"><span data-i18n="setKeepData"></span></label>
    <p class="muted" data-i18n="setUninstallTip"></p>
  </div>
  <div class="card">
    <h3 data-i18n="setWireless"></h3>
    <label class="sw"><input type="checkbox" data-set="autoReconnect"><span data-i18n="setAutoReconnect"></span></label>
  </div>
  <div class="card">
    <h3 data-i18n="setNotify"></h3>
    <label class="sw"><input type="checkbox" data-set="notify"><span data-i18n="setNotifyOn"></span></label>
    <label class="sw"><input type="checkbox" data-set="sound"><span data-i18n="setSound"></span></label>
  </div>
  <div class="card">
    <h3 data-i18n="setOut"></h3>
    <p class="muted" data-i18n="setOutTip"></p>
    <div class="dz-row"><input id="extractDir" type="text"><button id="btnSaveDir" class="primary small" data-i18n="save"></button></div>
  </div>
  <div class="card">
    <h3 data-i18n="setAdb"></h3>
    <p class="muted" id="adbPathText"></p>
    <div class="dz-row">
      <input id="adbPath" type="text" data-i18n-ph="adbPathPlaceholder">
      <button id="btnAdbSet" class="ghost small" data-i18n="adbUse"></button>
      <button id="btnAdbDl" class="primary small" data-i18n="adbDownload"></button>
    </div>
    <pre id="adbLog" class="minilog"></pre>
  </div>
</section>

<div id="toasts"></div>
<div id="modal" class="modal hidden"><div class="modal-box"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="modal-foot"><button id="modalOk" class="primary small">OK</button></div></div></div>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
